name: Ping & Sync Configs

on:
  schedule:
    - cron: '0 */3 * * *'   # هر ۳ ساعت (هماهنگ با TTL پروژه PHP)
  workflow_dispatch:         # امکان اجرای دستی

jobs:
  ping_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download configs from host
        run: |
          curl -sSL -o normal.txt \
            "${{ secrets.HOST_URL }}/get_configs.php?token=${{ secrets.API_TOKEN }}"

      - name: Run Sub Checker (Xray ping)
        run: |
          # پروژه Sub_Checker_Creator معمولاً اسکریپت اصلی را اجرا می‌کند
          # اگر فایل اجرایی متفاوتی دارد، مسیر آن را اینجا تنظیم کنید
          bash run.sh || python3 main.py || node index.js

      - name: Upload result to host
        run: |
          if [ -f final.txt ]; then
            CONFIGS=$(cat final.txt)
            curl -sSL -X POST \
              -d "token=${{ secrets.API_TOKEN }}" \
              --data-urlencode "configs=$CONFIGS" \
              "${{ secrets.HOST_URL }}/save_pinged.php"
          else
            echo "final.txt not found!"
            exit 1
          fi
